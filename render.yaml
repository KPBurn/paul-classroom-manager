# Render Blueprint for the API. In Render: New → Blueprint → select this repo.
services:
  - type: web
    name: paul-classroom-api
    runtime: node
    plan: free
    # The region is chosen in the Render dashboard. Use the one the Atlas cluster is in:
    # each request makes several database trips and pays the distance on every one (see README).
    rootDir: server
    buildCommand: npm ci --omit=dev
    # The seed runs on every start, wake-ups from sleep included: it connects to the database,
    # checks the seed accounts and disconnects before the API starts and connects again.
    startCommand: npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: '1'
      - key: CLIENT_URL
        value: https://kpburn.github.io
      - key: JWT_SECRET
        generateValue: true
      # Entered in the Render dashboard, never committed.
      - key: MONGODB_URI
        sync: false
