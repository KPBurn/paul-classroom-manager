# Render Blueprint for the API. In Render: New → Blueprint → select this repo.
services:
  - type: web
    name: paul-classroom-api
    runtime: node
    plan: free
    # The region is chosen in the Render dashboard. Use the one the Atlas cluster is in:
    # each request makes several database trips and pays the distance on every one (see README).
    rootDir: server
    buildCommand: npm ci --omit=dev
    # The seed runs on every start, wake-ups from sleep included: it connects to the database,
    # checks the seed accounts and disconnects before the API starts and connects again.
    startCommand: npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: '1'
      - key: CLIENT_URL
        value: https://kpburn.github.io
      - key: JWT_SECRET
        generateValue: true
      # Where the web app is opened, for the links in emails (password reset, enrollment status).
      - key: APP_URL
        value: https://kpburn.github.io/paul-classroom-manager
      # Entered in the Render dashboard, never committed.
      - key: MONGODB_URI
        sync: false
      # A Resend API key (resend.com). Without it no email is sent: the server logs each one it skipped.
      - key: RESEND_API_KEY
        sync: false
      # The sender, on a domain verified in Resend, such as "School Name <enrollment@school.edu>".
      - key: MAIL_FROM
        sync: false
      # Optional Zoom, offered beside the class room: a Server-to-Server OAuth app on the school's Zoom account.
      # Set all three or none. See README, "Zoom".
      - key: ZOOM_ACCOUNT_ID
        sync: false
      - key: ZOOM_CLIENT_ID
        sync: false
      - key: ZOOM_CLIENT_SECRET
        sync: false
